name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag matches build version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -n 1)"
          test "$TAG_VERSION" = "$BUILD_VERSION"

      - name: Run tests
        run: ./gradlew test

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          MAVEN_CENTRAL_DEPLOY_URL: ${{ secrets.MAVEN_CENTRAL_DEPLOY_URL }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publish

      - name: Finalize deployment in Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          PORTAL_TOKEN="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64)"
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${PORTAL_TOKEN}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/dev.unipost?publishing_type=automatic"
